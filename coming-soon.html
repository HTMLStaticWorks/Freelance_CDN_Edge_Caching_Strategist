<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Fast is Coming | EdgeFlux</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><polygon points=%2250,5 95,25 95,75 50,95 5,75 5,25%22 fill=%22%232563EB%22/><path d=%22M30,50 Q50,30 70,50 M35,55 Q50,40 65,55 M40,60 Q50,50 60,60%22 fill=%22none%22 stroke=%22white%22 stroke-width=%224%22/></svg>">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            color: white;
            text-align: center;
        }
        .coming-soon-card { max-width: 600px; padding: 2rem; }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 3rem 0;
        }
        .countdown div {
            display: flex;
            flex-direction: column;
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }
        .countdown span {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: white;
            opacity: 0.5;
            margin-top: 0.5rem;
            font-weight: 400;
        }
        .subscribe-form {
            display: flex;
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .subscribe-form input {
            flex: 1;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: white;
        }
    </style>
</head>
<body>

    <div class="coming-soon-card fade-in">
        <div class="logo" style="justify-content: center; margin-bottom: 2rem; font-size: 2rem; color: white;">
            <svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="#2563EB"/>
                <path d="M30,50 Q50,30 70,50 M35,55 Q50,40 65,55 M40,60 Q50,50 60,60" stroke="white" stroke-width="5" stroke-linecap="round"/>
            </svg>
            EdgeFlux
        </div>
        <h1>Something <span style="color: var(--primary);">Fast</span> Is Coming.</h1>
        <p style="opacity: 0.7; margin-top: 1rem;">We're optimizing our own global network nodes for the ultimate launch experience.</p>

        <div id="countdown" class="countdown">
            <!-- Populated by JS -->
            <div>00<span>Days</span></div>
            <div>00<span>Hours</span></div>
            <div>00<span>Minutes</span></div>
            <div>00<span>Seconds</span></div>
        </div>

        <form class="subscribe-form">
            <input type="email" placeholder="Enter your email for early access">
            <button class="btn btn-primary">Notify Me</button>
        </form>

        <div class="social-icons" style="justify-content: center; margin-top: 3rem;">
            <a href="#" class="social-icon">𝕏</a>
            <a href="#" class="social-icon">in</a>
            <a href="#" class="social-icon">gh</a>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
